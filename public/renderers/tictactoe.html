<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
    background: transparent; padding: 16px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(3, 80px);
    gap: 6px;
    margin: 12px auto;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    background: #f0f0f0; border-radius: 10px;
    font-size: 40px; font-weight: 700;
    transition: background 0.15s;
  }
  .cell.x { color: #2080f0; background: #e8f0ff; }
  .cell.o { color: #d03050; background: #ffe8ec; }
  .cell.win-x { background: #c0d8ff; box-shadow: 0 0 0 3px #2080f0; }
  .cell.win-o { background: #ffc0cc; box-shadow: 0 0 0 3px #d03050; }
  .cell.new-move { outline: 3px solid #f0a020; border-radius: 10px; }
  .info { font-size: 14px; color: #666; margin-bottom: 8px; text-align: center; }
  .move-info { font-size: 13px; color: #888; margin-top: 6px; }
  .score-row { display: flex; gap: 16px; margin-top: 10px; }
  .score-tag { padding: 3px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
  .score-x { background: #e8f0ff; color: #2080f0; }
  .score-o { background: #ffe8ec; color: #d03050; }
</style>
</head>
<body>
<div class="info" id="info">等待数据...</div>
<div class="board" id="board">
  <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div>
  <div class="cell" id="c3"></div><div class="cell" id="c4"></div><div class="cell" id="c5"></div>
  <div class="cell" id="c6"></div><div class="cell" id="c7"></div><div class="cell" id="c8"></div>
</div>
<div class="move-info" id="moveInfo"></div>
<div class="score-row" id="scoreRow" style="display:none">
  <span class="score-tag score-x" id="scoreX"></span>
  <span class="score-tag score-o" id="scoreO"></span>
</div>

<script>
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWin(board) {
  for (const line of WIN_LINES) {
    const [a,b,c] = line;
    if (board[a] && board[a] === board[b] && board[a] === board[c])
      return { player: board[a], line };
  }
  return null;
}

function render(data) {
  const { gameLog, round } = data;
  if (!gameLog || !gameLog.rounds) return;

  const idx = Math.max(0, Math.min(round, gameLog.rounds.length - 1));
  const r = gameLog.rounds[idx];

  // The board in display is BEFORE this round's moves.
  // The actual board after this round's moves is shown in the NEXT round's display.board.
  // So: use next round's board if available, otherwise apply moves manually.
  let board;
  let newMoveCells = new Set();

  const nextRound = gameLog.rounds[idx + 1];
  if (nextRound?.judgerDisplay?.board) {
    // Use next round's board (already includes this round's moves)
    board = nextRound.judgerDisplay.board;
    // Find which cells changed (the new moves)
    const prevBoard = r?.judgerDisplay?.board || Array(9).fill(0);
    for (let i = 0; i < 9; i++) {
      if (board[i] !== prevBoard[i]) newMoveCells.add(i);
    }
  } else {
    // Last round or finish: apply this round's botResponses to current board
    board = [...(r?.judgerDisplay?.board || Array(9).fill(0))];
    const bots = r?.botOutputs || {};
    for (const [pid, moveStr] of Object.entries(bots)) {
      const move = parseInt(String(moveStr));
      if (move >= 0 && move <= 8 && board[move] === 0) {
        board[move] = parseInt(pid) === 0 ? 1 : 2;
        newMoveCells.add(move);
      }
    }
  }

  document.getElementById('info').textContent =
    `第 ${r?.round ?? idx+1} 回合 / 共 ${gameLog.rounds.length} 回合`;

  const win = checkWin(board);
  const winCells = win ? new Set(win.line) : new Set();

  for (let i = 0; i < 9; i++) {
    const el = document.getElementById('c'+i);
    const v = board[i];
    el.textContent = v === 1 ? '✕' : v === 2 ? '○' : '';
    let cls = 'cell' + (v===1?' x':v===2?' o':'');
    if (winCells.has(i)) cls += (v===1?' win-x':' win-o');
    if (newMoveCells.has(i)) cls += ' new-move';
    el.className = cls;
  }

  const bots = r?.botOutputs || {};
  const moveParts = Object.entries(bots).map(([pid, mv]) =>
    `玩家${pid} 落子: ${mv}`
  );
  document.getElementById('moveInfo').textContent = moveParts.join('  |  ');

  const isLast = idx === gameLog.rounds.length - 1;
  const scoreRow = document.getElementById('scoreRow');
  if (isLast && gameLog.finalResult) {
    scoreRow.style.display = 'flex';
    const fr = gameLog.finalResult;
    const keys = Object.keys(fr);
    document.getElementById('scoreX').textContent = `玩家 ${keys[0]}: ${fr[keys[0]]} 分`;
    document.getElementById('scoreO').textContent = keys[1] !== undefined
      ? `玩家 ${keys[1]}: ${fr[keys[1]]} 分` : '';
  } else {
    scoreRow.style.display = 'none';
  }
}

window.addEventListener('message', (e) => {
  if (e.data?.type === 'gameLog') render(e.data);
});
</script>
</body>
</html>
